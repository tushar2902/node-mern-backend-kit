paths:
  /admin/user/login:
    post:
      tags:
        - "User"
      summary: "Log in User"
      description: ""
      operationId: "userLogin"
      requestBody:
        description:  admin login using email
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/adminLogin"
        required: true
      produces:
        - "application/json"
      parameters: []
      responses:
        "200":
          description: Logged in successfully"
        "400":
          description: "Invalid Request"
        "500":
          description: "Internal Server Error"
  /admin/user:
    get:
     tags:
       - "User"
     summary: "get profile"
     description: ""
     operationId: "getProfile"
     produces:
       - "application/json"
     parameters: [ ]
     security:
       - bearerAuth: [ ]
     responses:
       "200":
         description: "get user profile details"
       "400":
         description: "Invalid Request"
       "500":
         description: "Internal Server Error"
    put:
      tags:
        - "User"
      summary: "Update your profile"
      description: "Update admin or sub admin profile"
      operationId: "updateProfile"
      requestBody:
        description: update profile
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/adminProfile"
        required: true
      produces:
        - "application/json"
      parameters: [ ]
      security:
        - bearerAuth: [ ]
      responses:
        "200":
          description: "user created or updated successfully"
        "400":
          description: "Invalid Request"
        "500":
          description: "Internal Server Error"

components:
  schemas:
    adminLogin:
      type: object
      properties:
        email:
          type: string
          description: enter email address
        password:
          type: string
          description: enter password
    adminProfile:
      type: object
      properties:
        email:
          type: string
          description: enter email address
        password:
          type: string
          description: enter password
        firstName:
          type: string
          description: enter first name
        lastName:
          type: string
          description: enter last name